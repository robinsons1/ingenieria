<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Arquitectura Dual-WAN recursiva en MikroTik con VPN WireGuard y servidor local con backups 3-2-1">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060c18"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>
    <linearGradient id="routerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2239"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowOk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="328" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="28" y="30" fill="#22d3ee" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.8">TOPOLOGÍA VERIFICADA · FAILOVER RECURSIVO DUAL-WAN + VPN + RESPALDO LOCAL</text>
  <line x1="28" y1="40" x2="852" y2="40" stroke="#17243b" stroke-width="1"/>

  <!-- ISP 1 -->
  <rect x="28" y="58" width="212" height="106" rx="12" fill="#170c14" stroke="#7f1d1d" stroke-width="1.4"/>
  <rect x="42" y="72" width="102" height="20" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="93" y="85" fill="#fca5a5" font-family="Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">WAN 1 · CAÍDA</text>
  <text x="42" y="114" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">ISP 1 · Fibra Principal</text>
  <text x="42" y="134" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Check externo: 1.1.1.1</text>
  <text x="42" y="151" fill="#f87171" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Corte aguas arriba detectado</text>

  <!-- ISP 2 -->
  <rect x="28" y="186" width="212" height="106" rx="12" fill="#071b16" stroke="#065f46" stroke-width="1.5"/>
  <rect x="42" y="200" width="110" height="20" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="97" y="213" fill="#6ee7b7" font-family="Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">WAN 2 · ACTIVA</text>
  <text x="42" y="242" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">ISP 2 · Enlace Respaldo</text>
  <text x="42" y="262" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Check externo: 8.8.4.4</text>
  <text x="42" y="279" fill="#34d399" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Traspaso automático ~3 s</text>

  <!-- Conexiones WAN -> MikroTik -->
  <path d="M 240 111 C 280 111, 280 144, 316 144" fill="none" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>
  <text x="278" y="103" fill="#fca5a5" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">Timeout</text>

  <path d="M 240 239 C 280 239, 280 202, 316 202" fill="none" stroke="#10b981" stroke-width="2.4" marker-end="url(#arrowOk)"/>
  <text x="278" y="256" fill="#6ee7b7" font-family="Consolas, monospace" font-size="9.5" text-anchor="middle">Activo</text>

  <!-- Centro: MikroTik -->
  <rect x="322" y="66" width="236" height="222" rx="14" fill="url(#routerGrad)" stroke="#06b6d4" stroke-width="1.8"/>
  <rect x="322" y="66" width="236" height="4" rx="2" fill="#22d3ee"/>
  <text x="440" y="96" fill="#22d3ee" font-family="Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">NÚCLEO ROUTEROS</text>
  <text x="440" y="118" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" text-anchor="middle">Router MikroTik</text>

  <rect x="338" y="134" width="204" height="40" rx="8" fill="#0b1526" stroke="#1e3a5f" stroke-width="1"/>
  <text x="350" y="152" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Rutas recursivas externas</text>
  <text x="350" y="167" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">scope / target-scope real</text>

  <rect x="338" y="182" width="204" height="40" rx="8" fill="#0b1526" stroke="#1e3a5f" stroke-width="1"/>
  <text x="350" y="200" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Limpieza de sesiones</text>
  <text x="350" y="215" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">POS, VPN y cámaras sin colgar</text>

  <rect x="338" y="230" width="204" height="40" rx="8" fill="#0b1526" stroke="#1e3a5f" stroke-width="1"/>
  <text x="350" y="248" fill="#e2e8f0" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600">Hardening &amp; Backup .rsc</text>
  <text x="350" y="263" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">Cierre Winbox / SSH / DNS WAN</text>

  <!-- Conexiones MikroTik -> Operación -->
  <path d="M 558 122 C 588 122, 594 92, 622 92" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 558 176 L 622 176" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <path d="M 558 230 C 588 230, 594 260, 622 260" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrowCyan)"/>

  <!-- Destinos derecha -->
  <rect x="628" y="56" width="224" height="70" rx="12" fill="#0b1322" stroke="#1e3354" stroke-width="1.3"/>
  <text x="644" y="81" fill="#22d3ee" font-family="Consolas, monospace" font-size="10" font-weight="700">OPERACIÓN CONTINUA</text>
  <text x="644" y="100" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">POS, Datáfonos &amp; LAN</text>
  <text x="644" y="117" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Facturación y red local sin cortes</text>

  <rect x="628" y="140" width="224" height="70" rx="12" fill="#0b1322" stroke="#1e3354" stroke-width="1.3"/>
  <text x="644" y="165" fill="#fbbf24" font-family="Consolas, monospace" font-size="10" font-weight="700">TÚNELES CIFRADOS</text>
  <text x="644" y="184" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">WireGuard / Tailscale</text>
  <text x="644" y="201" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Reconexión automática por WAN 2</text>

  <rect x="628" y="224" width="224" height="74" rx="12" fill="#0b1322" stroke="#1e3354" stroke-width="1.3"/>
  <text x="644" y="248" fill="#34d399" font-family="Consolas, monospace" font-size="10" font-weight="700">NODO LOCAL + ALERTAS</text>
  <text x="644" y="267" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="13.5" font-weight="700">Debian/Docker + 3-2-1</text>
  <text x="644" y="284" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Pi-hole, respaldos y alerta Telegram</text>
</svg>
