<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="264" height="60" viewBox="0 0 264 60">
  <title>Ingeniería by Ingversia</title>

  <!-- Cuadro modular 2x2: 3 módulos claros + 1 módulo cian técnico -->
  <rect x="2"  y="5"  width="23" height="23" rx="4.5" fill="#f8fafc"/>
  <rect x="29" y="5"  width="23" height="23" rx="4.5" fill="#f8fafc"/>
  <rect x="2"  y="32" width="23" height="23" rx="4.5" fill="#f8fafc"/>
  <rect x="29" y="32" width="23" height="23" rx="4.5" fill="#06b6d4"/>

  <!-- Wordmark INGENIERÍA -->
  <text
    x="68"
    y="25"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="900"
    letter-spacing="0.4"
    fill="#f8fafc"
    dominant-baseline="central"
  >INGENIERÍA</text>

  <!-- Línea de acento técnico bajo el wordmark -->
  <line x1="68" y1="48" x2="256" y2="48" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
