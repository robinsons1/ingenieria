services:
  ingenieria_web:
    image: nginx:1.27-alpine
    container_name: ingenieria_web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      # Binding estricto a Tailscale (aislamiento LAN física según estándar Ingversia)
      # Para pruebas locales en otra máquina, cambia temporalmente a "127.0.0.1:8087:80"
      - "100.92.40.116:8087:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
