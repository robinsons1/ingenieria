<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="Flujo de hardware desde esquemático y diseño PCB 1-2 capas hasta armado THT y gabinete BerdeX 3D">
  <defs>
    <linearGradient id="bgPcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="878" height="268" rx="16" fill="url(#bgPcb)" stroke="#1e293b" stroke-width="1.5"/>
  <text x="26" y="30" fill="#fbbf24" font-family="Consolas, monospace" font-size="11" font-weight="700" letter-spacing="0.8">FLUJO DE INGENIERÍA ELECTRÓNICA · DEL PROTOTIPO A LA UNIDAD ENCAPSULADA</text>
  <line x1="26" y1="40" x2="854" y2="40" stroke="#18243a" stroke-width="1"/>

  <!-- Paso 1 -->
  <rect x="26" y="56" width="186" height="154" rx="13" fill="#0c1424" stroke="#1e3a5f" stroke-width="1.4"/>
  <rect x="26" y="56" width="186" height="3.5" rx="1.5" fill="#22d3ee"/>
  <text x="42" y="82" fill="#22d3ee" font-family="Consolas, monospace" font-size="10.5" font-weight="700">FASE 01</text>
  <text x="42" y="104" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">Esquemático &amp; BOM</text>
  <rect x="42" y="118" width="154" height="44" rx="8" fill="#070e1c" stroke="#1a2c47" stroke-width="1"/>
  <path d="M 56 140 H 78 L 84 130 L 92 150 L 100 130 L 108 150 L 114 140 H 140" fill="none" stroke="#22d3ee" stroke-width="1.6"/>
  <circle cx="158" cy="140" r="8" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="42" y="182" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Fuente, protecciones, MCU</text>
  <text x="42" y="198" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">y selección de componentes</text>

  <path d="M 212 133 H 234" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Paso 2 -->
  <rect x="240" y="56" width="186" height="154" rx="13" fill="#12110b" stroke="#78350f" stroke-width="1.4"/>
  <rect x="240" y="56" width="186" height="3.5" rx="1.5" fill="#fbbf24"/>
  <text x="256" y="82" fill="#fbbf24" font-family="Consolas, monospace" font-size="10.5" font-weight="700">FASE 02</text>
  <text x="256" y="104" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">PCB 1–2 Capas</text>
  <rect x="256" y="118" width="154" height="44" rx="8" fill="#091914" stroke="#14532d" stroke-width="1"/>
  <path d="M 268 132 H 302 L 314 146 H 352" fill="none" stroke="#34d399" stroke-width="1.8"/>
  <path d="M 268 148 H 294 L 306 134 H 368" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
  <circle cx="268" cy="132" r="3" fill="#fbbf24"/>
  <circle cx="352" cy="146" r="3" fill="#fbbf24"/>
  <circle cx="368" cy="134" r="3" fill="#22d3ee"/>
  <rect x="380" y="128" width="18" height="24" rx="2" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <text x="256" y="182" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Pistas de potencia y señal</text>
  <text x="256" y="198" fill="#fde68a" font-family="Consolas, monospace" font-size="11">Gerbers + taladros + DRC</text>

  <path d="M 426 133 H 448" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Paso 3 -->
  <rect x="454" y="56" width="186" height="154" rx="13" fill="#0c1424" stroke="#1e3a5f" stroke-width="1.4"/>
  <rect x="454" y="56" width="186" height="3.5" rx="1.5" fill="#22d3ee"/>
  <text x="470" y="82" fill="#22d3ee" font-family="Consolas, monospace" font-size="10.5" font-weight="700">FASE 03</text>
  <text x="470" y="104" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">Armado THT &amp; Banco</text>
  <rect x="470" y="118" width="154" height="44" rx="8" fill="#070e1c" stroke="#1a2c47" stroke-width="1"/>
  <circle cx="494" cy="140" r="5" fill="#fbbf24"/>
  <circle cx="520" cy="140" r="5" fill="#fbbf24"/>
  <circle cx="546" cy="140" r="5" fill="#fbbf24"/>
  <path d="M 568 140 L 578 149 L 598 129" fill="none" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="470" y="182" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Soldadura pasante (THT)</text>
  <text x="470" y="198" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">+ firmware ESP32 y carga</text>

  <path d="M 640 133 H 662" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Paso 4 -->
  <rect x="668" y="56" width="186" height="154" rx="13" fill="#071914" stroke="#065f46" stroke-width="1.4"/>
  <rect x="668" y="56" width="186" height="3.5" rx="1.5" fill="#10b981"/>
  <text x="684" y="82" fill="#34d399" font-family="Consolas, monospace" font-size="10.5" font-weight="700">FASE 04</text>
  <text x="684" y="104" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="14.5" font-weight="700">Carcasa BerdeX 3D</text>
  <rect x="684" y="118" width="154" height="44" rx="8" fill="#06120f" stroke="#115e59" stroke-width="1"/>
  <polygon points="712,130 742,123 772,130 772,150 742,157 712,150" fill="#0d2922" stroke="#34d399" stroke-width="1.4"/>
  <line x1="742" y1="123" x2="742" y2="157" stroke="#34d399" stroke-width="1"/>
  <rect x="786" y="131" width="38" height="18" rx="4" fill="#f5821f" fill-opacity="0.2" stroke="#f5821f" stroke-width="1"/>
  <text x="805" y="143" fill="#fdba74" font-family="Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">DIN 3D</text>
  <text x="684" y="182" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">Gabinete a medida riel DIN</text>
  <text x="684" y="198" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5">FDM multicolor (4 colores)</text>

  <!-- Barra de entregables -->
  <rect x="26" y="224" width="828" height="30" rx="8" fill="#091323" stroke="#1b2b44" stroke-width="1"/>
  <text x="440" y="243" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Entrega completa: Esquemático PDF · Archivos Gerbers y BOM · Código fuente comentado · Unidad armada y probada</text>
</svg>
