<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="268" height="60" viewBox="0 0 268 60">
  <title>Ingeniería by Ingversia</title>

  <!-- Símbolo idéntico al favicon y símbolo oficial -->
  <rect x="1" y="4" width="52" height="52" rx="11" fill="#0b1324" stroke="#1e3354" stroke-width="1.5"/>
  <rect x="9"  y="12" width="16" height="16" rx="3.5" fill="#f8fafc"/>
  <rect x="29" y="12" width="16" height="16" rx="3.5" fill="#f8fafc"/>
  <rect x="9"  y="32" width="16" height="16" rx="3.5" fill="#f8fafc"/>
  <rect x="29" y="32" width="16" height="16" rx="3.5" fill="#06b6d4"/>

  <!-- Wordmark INGENIERÍA -->
  <text
    x="68"
    y="26"
    font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="30"
    font-weight="900"
    letter-spacing="0.4"
    fill="#f8fafc"
    dominant-baseline="central"
  >INGENIERÍA</text>

  <!-- Línea de acento técnico bajo el wordmark -->
  <line x1="68" y1="49" x2="258" y2="49" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
</svg>
